<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曙光号 · 破晓之战 — 60s 宇宙空战</title>
<style>
  :root{
    --bg:#03050c; --panel:#0a0f1d; --panel2:#0e1526; --line:#1c2a4a;
    --ink:#dfe8f6; --ink-dim:#7d8db0; --cyan:#7fe3ff; --blue:#2e63e7;
    --deep:#16295e; --red:#ff2b45; --gold:#f5c542; --ok:#3ddc97;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    color:var(--ink); display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--panel)}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--blue),var(--deep));border-radius:5px;border:2px solid var(--panel)}
  ::-webkit-scrollbar-thumb:hover{background:var(--cyan)}

  #stage-wrap{
    position:relative; flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%, #071021 0%, #03050c 70%);
  }
  #frame{position:relative; line-height:0; box-shadow:0 0 90px rgba(46,99,231,.16), 0 0 24px rgba(0,0,0,.9);}
  #stage{display:block; background:#000;}
  /* ---- HUD ---- */
  .hud{position:absolute; line-height:1.35; pointer-events:none; z-index:5;}
  #hud-title{top:26px; left:34px;}
  #hud-title .logo{
    font-size:25px; font-weight:800; letter-spacing:.34em; color:var(--ink);
    text-shadow:0 0 18px rgba(127,227,255,.55);
  }
  #hud-title .logo b{color:var(--cyan)}
  #hud-title .sub{font-size:10px; letter-spacing:.52em; color:var(--ink-dim); margin-top:5px;}
  #hud-act{
    top:86px; left:34px; display:flex; align-items:center; gap:10px;
    font-size:13px; letter-spacing:.22em;
  }
  #hud-act .chip{
    padding:4px 12px; border:1px solid rgba(127,227,255,.45); color:var(--cyan);
    background:rgba(10,18,38,.55); backdrop-filter:blur(3px);
    clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
    font-weight:700;
  }
  #hud-act .en{color:var(--ink-dim); font-size:10px; letter-spacing:.4em;}
  #hud-tc{top:28px; right:34px; text-align:right;}
  #hud-tc .tc{font-family:"Consolas","SF Mono",monospace; font-size:21px; color:var(--ink); letter-spacing:.12em; text-shadow:0 0 12px rgba(127,227,255,.35);}
  #hud-tc .meta{font-size:10px; color:var(--ink-dim); letter-spacing:.3em; margin-top:4px;}
  #hud-tc .meta em{font-style:normal;color:var(--ok)}
  .corner{position:absolute;width:26px;height:26px;border:2px solid rgba(127,227,255,.4);z-index:4;pointer-events:none}
  .corner.tl{top:16px;left:16px;border-right:none;border-bottom:none}
  .corner.tr{top:16px;right:16px;border-left:none;border-bottom:none}
  .corner.bl{bottom:16px;left:16px;border-right:none;border-top:none}
  .corner.br{bottom:16px;right:16px;border-left:none;border-top:none}
  /* ---- 字幕 / 必杀卡 / 定格标题 ---- */
  #subtitle{
    position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
    font-size:22px; letter-spacing:.18em; color:var(--ink); white-space:nowrap;
    text-shadow:0 0 14px rgba(0,0,0,.95), 0 2px 6px rgba(0,0,0,.85);
    padding:6px 26px; opacity:0; z-index:6; pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(4,8,18,.72) 18%,rgba(4,8,18,.72) 82%,transparent);
  }
  #fin-card{
    position:absolute; top:110px; right:120px; z-index:7; pointer-events:none; opacity:0;
    display:flex; gap:16px; align-items:flex-start; transform-origin:100% 0;
  }
  #fin-card .ja{
    writing-mode:vertical-rl; font-size:92px; font-weight:900; letter-spacing:.1em; color:#fff;
    text-shadow:0 0 30px rgba(127,227,255,.95), 0 0 8px rgba(127,227,255,.8);
  }
  #fin-card .rule{width:3px; align-self:stretch; background:linear-gradient(180deg,var(--cyan),transparent);}
  #fin-card .zh{writing-mode:vertical-rl; font-size:19px; letter-spacing:.3em; color:var(--cyan); margin-top:6px;}
  #title-card{position:absolute; left:0; right:0; top:140px; text-align:center; z-index:7; pointer-events:none; opacity:0;}
  #title-card .zh{font-size:86px; font-weight:900; letter-spacing:.3em; color:var(--ink); text-shadow:0 0 34px rgba(127,227,255,.65);}
  #title-card .en{margin-top:10px; font-size:16px; letter-spacing:.72em; color:var(--cyan);}
  #title-card .sub{margin-top:14px; font-size:11px; letter-spacing:.5em; color:var(--ink-dim);}
  #hud-snd{
    top:76px; right:34px; width:34px; height:34px; z-index:8; pointer-events:auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:rgba(10,18,38,.55); border:1px solid rgba(127,227,255,.4); border-radius:8px;
    color:var(--cyan); backdrop-filter:blur(3px); transition:all .15s;
  }
  #hud-snd:hover{border-color:var(--cyan); box-shadow:0 0 12px rgba(127,227,255,.3);}
  #hud-snd svg{width:16px;height:16px;fill:currentColor}
  #hud-snd.on{color:var(--red); border-color:rgba(255,43,69,.5);}
  #veil{
    position:absolute; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:var(--bg); transition:opacity .8s ease; line-height:1.6;
  }
  #veil.gone{opacity:0; pointer-events:none}
  #veil .ring{
    width:54px;height:54px;border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--cyan);
    animation:spin 1s linear infinite;
  }
  #veil .txt{font-size:12px;letter-spacing:.5em;color:var(--ink-dim)}
  #veil .err{max-width:520px;text-align:center;color:var(--red);font-size:14px;display:none;padding:0 20px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---- 控制条 ---- */
  #controls{
    flex:0 0 auto; display:flex; align-items:center; gap:16px;
    padding:12px 22px 14px; background:linear-gradient(180deg,var(--panel2),var(--panel));
    border-top:1px solid var(--line); user-select:none; z-index:10;
  }
  .btn{
    width:42px;height:42px; flex:0 0 auto; display:flex;align-items:center;justify-content:center;
    background:rgba(46,99,231,.12); border:1px solid var(--line); border-radius:9px;
    color:var(--ink); cursor:pointer; transition:all .18s ease; position:relative;
  }
  .btn:hover{border-color:var(--cyan); color:var(--cyan); background:rgba(127,227,255,.1); box-shadow:0 0 14px rgba(127,227,255,.25)}
  .btn:active{transform:scale(.93)}
  .btn svg{width:18px;height:18px;fill:currentColor}
  .btn.on{border-color:var(--red); color:var(--red); background:rgba(255,43,69,.12); box-shadow:0 0 14px rgba(255,43,69,.3)}
  .btn .tip{
    position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:#060a16; border:1px solid var(--line); color:var(--ink-dim);
    font-size:10px; letter-spacing:.15em; padding:4px 8px; border-radius:5px;
    white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s;
  }
  .btn:hover .tip{opacity:1}
  #btn-play{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,rgba(46,99,231,.35),rgba(127,227,255,.16));border-color:rgba(127,227,255,.5)}
  #btn-play svg{width:22px;height:22px}

  #track-zone{flex:1 1 auto; display:flex; flex-direction:column; gap:6px; min-width:0;}
  #track{
    position:relative; height:22px; cursor:pointer; touch-action:none;
    display:flex; align-items:center;
  }
  #track .rail{
    position:absolute; left:0; right:0; height:6px; border-radius:3px;
    background:#101a33; border:1px solid #1a2745; overflow:hidden;
  }
  #track .fill{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:linear-gradient(90deg,var(--deep),var(--blue) 55%,var(--cyan));
    box-shadow:0 0 12px rgba(127,227,255,.5);
  }
  #track .tick{position:absolute; top:-3px; width:2px; height:12px; background:rgba(223,232,246,.35); z-index:2;}
  #track .thumb{
    position:absolute; top:50%; left:0%; width:15px; height:15px; z-index:3;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--cyan); border:2px solid #eafcff;
    box-shadow:0 0 14px rgba(127,227,255,.9); transition:width .12s,height .12s;
  }
  #track:hover .thumb{width:18px;height:18px}
  #track-labels{display:flex; justify-content:space-between; font-size:10px; color:var(--ink-dim); letter-spacing:.18em;}
  #track-labels .acts{display:flex; gap:14px; overflow:hidden;}
  #track-labels .acts span{cursor:pointer; transition:color .15s; white-space:nowrap;}
  #track-labels .acts span:hover{color:var(--cyan)}
  #track-labels .acts span.cur{color:var(--cyan); text-shadow:0 0 8px rgba(127,227,255,.6)}
  #tc-read{font-family:"Consolas",monospace; font-size:13px; color:var(--ink); letter-spacing:.1em; flex:0 0 auto;}
  #tc-read small{color:var(--ink-dim)}
  #kbd-hint{font-size:10px;color:#43537a;letter-spacing:.12em;flex:0 0 auto;white-space:nowrap}
  @media (max-width:900px){ #kbd-hint{display:none} #hud-title .logo{font-size:18px} #track-labels > span:last-child{display:none} #track-labels .acts{gap:9px} #controls{gap:10px;padding:10px 12px} }
</style>
</head>
<body>
  <div id="stage-wrap">
    <div id="frame">
      <canvas id="stage" width="1920" height="1080"></canvas>
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="hud" id="hud-title">
        <div class="logo">曙<b>光</b>号</div>
        <div class="sub">DAWN BREAKER · ORBITAL ENGAGEMENT</div>
      </div>
      <div class="hud" id="hud-act"><span class="chip" id="act-chip">幕一 · 突围被围</span><span class="en" id="act-en">ENCIRCLED</span></div>
      <div class="hud" id="hud-tc">
        <div class="tc" id="tc">00:00:00</div>
        <div class="meta">1920×1080 · <em id="fps">60</em> FPS</div>
      </div>
      <div class="hud" id="subtitle"></div>
      <button class="hud" id="hud-snd" aria-label="声音 开/关">
        <svg id="ic-snd2" viewBox="0 0 24 24"><path d="M3 9v6h4l6 5V4L7 9H3z"/><path d="M16 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <svg id="ic-mut2" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l6 5V4L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <div class="hud" id="fin-card"><div class="ja" id="fin-ja"></div><div class="rule"></div><div class="zh" id="fin-zh"></div></div>
      <div class="hud" id="title-card"><div class="zh" id="title-zh"></div><div class="en" id="title-en"></div><div class="sub" id="title-sub"></div></div>
      <div id="veil">
        <div class="ring"></div>
        <div class="txt">引擎点火中</div>
        <div class="err" id="veil-err"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="btn" id="btn-play" aria-label="播放/暂停">
      <svg id="ic-play" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z"/></svg>
      <svg id="ic-pause" viewBox="0 0 24 24" style="display:none"><path d="M5 4h5v16H5zM14 4h5v16h-5z"/></svg>
      <span class="tip">播放 / 暂停（空格）</span>
    </button>
    <button class="btn" id="btn-replay" aria-label="重播">
      <svg viewBox="0 0 24 24"><path d="M12 5V1L6 7l6 6V9a7 7 0 1 1-7 7H3a9 9 0 1 0 9-11z"/></svg>
      <span class="tip">重播（R）</span>
    </button>
    <button class="btn" id="btn-rev" aria-label="倒放">
      <svg viewBox="0 0 24 24"><path d="M17 4L3 12l14 8zM21 4v16h-2V4z" transform="scale(-1,1) translate(-24,0)"/></svg>
      <span class="tip">倒放（V）</span>
    </button>
    <button class="btn" id="btn-mute" aria-label="声音开关">
      <svg id="ic-snd" viewBox="0 0 24 24"><path d="M3 9v6h4l6 5V4L7 9H3z"/><path d="M16 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <svg id="ic-mut" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l6 5V4L7 9H3z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="tip">声音 开/关（M）</span>
    </button>
    <div id="track-zone">
      <div id="track">
        <div class="rail"><div class="fill" id="fill"></div></div>
        <div class="thumb" id="thumb"></div>
      </div>
      <div id="track-labels">
        <div class="acts" id="act-labels"></div>
        <span>拖动跳转 · 任意位置可逆放</span>
      </div>
    </div>
    <div id="tc-read"><span id="tc-cur">00:00.0</span><small> / 01:00.0</small></div>
    <div id="kbd-hint">空格 播放 · R 重播 · V 倒放 · ←/→ ±2s · M 静音</div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

   架构铁律：一切画面状态 = 主时间轴时间 t 的纯函数（可拖动 / 可倒放）

/* ---------------- 确定性工具 ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(CONFIG.seed);
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = u => u * u * (3 - 2 * u);
const easePow = u => 1 - Math.pow(1 - u, 3);
/* 确定性"噪声"抖动：无理数频率正弦叠加，纯 f(t)，倒放安全 */
function shakeNoise(t, s) {
  return Math.sin(t * 13.7 + s * 1.7) * 0.52 + Math.sin(t * 27.3 + s * 3.1) * 0.31 + Math.sin(t * 47.9 + s * 5.3) * 0.17;
}
function fmtTC(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), f = Math.floor((t % 1) * CONFIG.fps);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + ':' + String(f).padStart(2, '0');
}
function fmtShort(t) {
  const m = Math.floor(t / 60), s = (t % 60).toFixed(1).padStart(4, '0');
  return String(m).padStart(2, '0') + ':' + s;
}

}

}

/* ---------------- 渲染器与自写后处理链 ----------------
   cdnjs 全局版 three 不含官方 EffectComposer，故手写：
   场景 → 亮度提取 → 半分辨率双向高斯×2 → 合成(泛光/色差/暗角/颗粒/ACES) */
const W = CONFIG.width, H = CONFIG.height;

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

renderer.setPixelRatio(CONFIG.quality.pixelRatio);

const scene = new THREE.Scene();

camera.position.set(300, 120, 470);

const gl = renderer.getContext();
const hdrOK = renderer.capabilities.isWebGL2 || !!gl.getExtension('OES_texture_half_float');
const rtType = hdrOK ? THREE.HalfFloatType : THREE.UnsignedByteType;
function makeRT(w, h, depth) {
  return new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, type: rtType, depthBuffer: !!depth, stencilBuffer: false
  });
}
const rtScene = makeRT(W, H, true);
const rtA = makeRT(W / 2, H / 2, false);
const rtB = makeRT(W / 2, H / 2, false);

const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadScene = new THREE.Scene();
const quadGeo = new THREE.PlaneGeometry(2, 2);
const quadMesh = new THREE.Mesh(quadGeo, null);
quadMesh.frustumCulled = false;
quadScene.add(quadMesh);
const QUAD_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const brightMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uThreshold: { value: CONFIG.fx.bloomThreshold } },
  vertexShader: QUAD_VS,
  fragmentShader: `
    uniform sampler2D tSrc; uniform float uThreshold; varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tSrc, vUv).rgb;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      float w = smoothstep(uThreshold, uThreshold + 0.55, l);
      gl_FragColor = vec4(c * w, 1.0);
    }`
});
const blurMat = new THREE.ShaderMaterial({
  uniforms: { tSrc: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uTexel: { value: new THREE.Vector2(2 / W, 2 / H) }, uRadius: { value: 1.4 } },
  vertexShader: QUAD_VS,
  fragmentShader: `
    uniform sampler2D tSrc; uniform vec2 uDir; uniform vec2 uTexel; uniform float uRadius;
    varying vec2 vUv;
    void main(){
      vec2 off = uDir * uTexel * uRadius;
      vec3 c = texture2D(tSrc, vUv).rgb * 0.227027;
      c += texture2D(tSrc, vUv + off * 1.3846).rgb * 0.3162162;
      c += texture2D(tSrc, vUv - off * 1.3846).rgb * 0.3162162;
      c += texture2D(tSrc, vUv + off * 3.2308).rgb * 0.0702703;
      c += texture2D(tSrc, vUv - off * 3.2308).rgb * 0.0702703;
      gl_FragColor = vec4(c, 1.0);
    }`
});
const compositeMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: null }, tBloom: { value: null },
    uBloom: { value: CONFIG.fx.bloomIntensity }, uExposure: { value: CONFIG.fx.exposure },
    uAber: { value: CONFIG.fx.aberration }, uVig: { value: CONFIG.fx.vignette },
    uGrain: { value: CONFIG.fx.grain }, uFlash: { value: 0 }, uTime: { value: 0 },
    uRes: { value: new THREE.Vector2(W, H) }
  },
  vertexShader: QUAD_VS,
  fragmentShader: `
    uniform sampler2D tScene; uniform sampler2D tBloom;
    uniform float uBloom, uExposure, uAber, uVig, uGrain, uFlash, uTime;
    uniform vec2 uRes; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + floor(uTime * 24.0) * 61.7) * 43758.5453); }
    vec3 aces(vec3 x){
      return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
    }
    void main(){
      vec2 d = vUv - 0.5;
      float r2 = dot(d, d);
      vec2 ab = d * uAber * (0.4 + r2 * 3.0) * 1.6;
      vec3 c;
      c.r = texture2D(tScene, vUv + ab).r;
      c.g = texture2D(tScene, vUv).g;
      c.b = texture2D(tScene, vUv - ab).b;
      c += texture2D(tBloom, vUv).rgb * uBloom;
      c = aces(c * uExposure);
      c = mix(c, vec3(1.0), uFlash);
      float vig = 1.0 - uVig * smoothstep(0.18, 0.72, r2);
      c *= vig;
      c = pow(max(c, 0.0), vec3(1.0 / 2.2));
      c += (hash(vUv * uRes) - 0.5) * uGrain;
      gl_FragColor = vec4(c, 1.0);
    }`
});
function runPass(mat, target) {
  quadMesh.material = mat;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, quadCam);
}
function renderFrame(t, fxState) {
  renderer.setRenderTarget(rtScene);
  renderer.render(scene, camera);
  brightMat.uniforms.tSrc.value = rtScene.texture;
  runPass(brightMat, rtA);
  const u = blurMat.uniforms;
  u.tSrc.value = rtA.texture; u.uDir.value.set(1, 0); u.uRadius.value = CONFIG.fx.blurRadius1; runPass(blurMat, rtB);
  u.tSrc.value = rtB.texture; u.uDir.value.set(0, 1); u.uRadius.value = CONFIG.fx.blurRadius1; runPass(blurMat, rtA);
  u.tSrc.value = rtA.texture; u.uDir.value.set(1, 0); u.uRadius.value = CONFIG.fx.blurRadius2; runPass(blurMat, rtB);
  u.tSrc.value = rtB.texture; u.uDir.value.set(0, 1); u.uRadius.value = CONFIG.fx.blurRadius2; runPass(blurMat, rtA);
  const cu = compositeMat.uniforms;
  cu.tScene.value = rtScene.texture; cu.tBloom.value = rtA.texture;
  cu.uTime.value = t;
  cu.uBloom.value = fxState.bloom; cu.uAber.value = fxState.aberration;
  cu.uFlash.value = fxState.flash; cu.uVig.value = fxState.vignette;
  renderer.setRenderTarget(null);
  runPass(compositeMat, null);
}

/* ---------------- 环境：星云穹顶 / 星场 / 恒星 / 地球 / 小行星带 / 尘埃 ---------------- */
const NOISE_GLSL = `
  float hash13(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  float vnoise(vec3 p){
    vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    float a = hash13(i), b = hash13(i + vec3(1,0,0)), c = hash13(i + vec3(0,1,0)), d = hash13(i + vec3(1,1,0));
    float e = hash13(i + vec3(0,0,1)), g = hash13(i + vec3(1,0,1)), h = hash13(i + vec3(0,1,1)), k = hash13(i + vec3(1,1,1));
    return mix(mix(mix(a,b,f.x), mix(c,d,f.x), f.y), mix(mix(e,g,f.x), mix(h,k,f.x), f.y), f.z);
  }
  float fbm(vec3 p){
    float v = 0.0, a = 0.5;
    for(int i = 0; i < 4; i++){ v += a * vnoise(p); p = p * 2.13 + vec3(7.7); a *= 0.5; }
    return v;
  }
`;

/* 星云穹顶 */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    uA: { value: new THREE.Color(C.nebulaA) }, uB: { value: new THREE.Color(C.nebulaB) },
    uC: { value: new THREE.Color(C.nebulaC) }, uTime: { value: 0 }
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: NOISE_GLSL + `
    uniform vec3 uA, uB, uC; uniform float uTime; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float n1 = fbm(d * 2.3 + vec3(3.1, 0.0, uTime * 0.004));
      float n2 = fbm(d * 4.1 + vec3(11.7, 5.2, 0.0));
      float band = pow(1.0 - abs(dot(d, normalize(vec3(0.2, 1.0, 0.35)))), 2.6);
      vec3 col = vec3(0.012, 0.02, 0.045);
      col = mix(col, uA * 0.5, smoothstep(0.42, 0.85, n1) * 0.85);
      col = mix(col, uB * 0.42, smoothstep(0.5, 0.92, n2) * band);
      col += uC * pow(max(n2 - 0.55, 0.0) * 2.2, 3.0) * 0.5;
      col += vec3(0.05, 0.07, 0.13) * band * 0.4;
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(11500, 48, 32), skyMat));

/* 远景星场（闪烁 = f(t)） */
function buildStars() {
  const n = CONFIG.quality.stars;
  const pos = new Float32Array(n * 3), size = new Float32Array(n), phase = new Float32Array(n), tint = new Float32Array(n * 3);
  const col = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const u = rng() * 2 - 1, th = rng() * Math.PI * 2, r = 7200 + rng() * 1600;
    const s = Math.sqrt(1 - u * u);
    pos[i * 3] = r * s * Math.cos(th); pos[i * 3 + 1] = r * u; pos[i * 3 + 2] = r * s * Math.sin(th);
    size[i] = 1.1 + Math.pow(rng(), 2.4) * 3.1;
    phase[i] = rng() * 6.283;
    col.setHex(C.starTints[Math.floor(rng() * C.starTints.length)]);
    tint[i * 3] = col.r; tint[i * 3 + 1] = col.g; tint[i * 3 + 2] = col.b;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
  g.setAttribute('aTint', new THREE.BufferAttribute(tint, 3));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float aSize; attribute float aPhase; attribute vec3 aTint;
      uniform float uTime; varying vec3 vTint; varying float vTw;
      void main(){
        vTint = aTint;
        vTw = 0.72 + 0.28 * sin(uTime * (1.3 + fract(aPhase) * 2.2) + aPhase * 7.0);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vTint; varying float vTw;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.06, d);
        gl_FragColor = vec4(vTint * vTw * 1.35, a * vTw);
      }`
  });
  const pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  return m;
}
const starMat = buildStars();

/* 恒星（太阳）：核心 + 光晕 + 横向光斑，始终面向相机 */
const sunGroup = new THREE.Group();
sunGroup.position.copy(sunDir).multiplyScalar(CONFIG.world.sunDist);
function sunPlane(size, power, tint, stretchX, stretchY) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTint: { value: new THREE.Color(tint) }, uPower: { value: power }, uStretch: { value: new THREE.Vector2(stretchX || 1, stretchY || 1) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 uTint; uniform float uPower; uniform vec2 uStretch; varying vec2 vUv;
      void main(){
        vec2 d = (vUv - 0.5) * 2.0 * uStretch;
        float r = length(d);
        float a = pow(max(1.0 - r, 0.0), 2.4);
        gl_FragColor = vec4(uTint * uPower * a, a);
      }`
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(size, size), m);
  sunGroup.add(mesh);
  return mesh;
}
sunPlane(1700, 0.4, C.sun, 1, 1);

/* 地球：程序化大陆 / 云层 / 大气辉光 */
const earthGroup = new THREE.Group();
earthGroup.position.set(...CONFIG.world.earthPos);
const earthUniforms = {
  uSun: { value: sunDir }, uTime: { value: 0 },
  uOcean: { value: new THREE.Color(C.earthOcean) },
  uLand: { value: new THREE.Color(C.earthLand) },
  uIce: { value: new THREE.Color(C.earthIce) }
};
const earthMat = new THREE.ShaderMaterial({
  uniforms: earthUniforms,
  vertexShader: `
    varying vec3 vN; varying vec3 vW;
    void main(){
      vN = normalize(mat3(modelMatrix) * normal);
      vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: NOISE_GLSL + `
    uniform vec3 uSun, uOcean, uLand, uIce; uniform float uTime;
    varying vec3 vN; varying vec3 vW;
    void main(){
      vec3 n = normalize(vN);
      float cont = fbm(n * 2.7 + vec3(4.7));
      float land = smoothstep(0.5, 0.55, cont);
      float detail = fbm(n * 8.0 + vec3(9.2));
      vec3 ocean = mix(uOcean * 0.55, uOcean * 1.25, detail);
      vec3 soil = mix(uLand, vec3(0.36, 0.29, 0.17), smoothstep(0.45, 0.8, detail));
      vec3 surf = mix(ocean, soil, land);
      float ice = smoothstep(0.78, 0.88, abs(n.y) + detail * 0.1);
      surf = mix(surf, uIce, ice);
      float dl = dot(n, uSun);
      float day = smoothstep(-0.06, 0.28, dl);
      vec3 viewDir = normalize(cameraPosition - vW);
      float spec = pow(max(dot(reflect(-uSun, n), viewDir), 0.0), 42.0) * (1.0 - land) * (1.0 - ice);
      vec3 col = surf * (0.035 + day * 1.25) + vec3(1.0, 0.95, 0.8) * spec * day * 0.7;
      col += uOcean * 0.06 * (1.0 - day);
      gl_FragColor = vec4(col, 1.0);

function makeTrail(opts) {

  for (let i = 0; i < n; i++) {
    seed[i * 4] = rng(); seed[i * 4 + 1] = rng(); seed[i * 4 + 2] = rng(); seed[i * 4 + 3] = rng();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: {
      uTime: { value: 0 }, uIntensity: { value: 1 },
      uLength: { value: opts.length }, uSpread: { value: opts.spread },
      uSize: { value: opts.size }, uLife: { value: opts.life || 0.55 },
      uColor: { value: new THREE.Color(opts.color) }

    vertexShader: `
      attribute vec4 aSeed;
      uniform float uTime, uIntensity, uLength, uSpread, uSize, uLife;
      varying float vAge; varying float vOn;
      void main(){

        vAge = age; vOn = uIntensity;
        float spread = uSpread * (0.35 + age * 1.6);
        vec3 p = vec3((aSeed.x - 0.5) * spread, (aSeed.y - 0.5) * spread, age * uLength * (0.75 + aSeed.z * 0.5));

        gl_PointSize = clamp(sz * 340.0 / max(-mv.z, 1.0), 0.5, 64.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor; varying float vAge; varying float vOn;
      void main(){
        float d = length(gl_PointCoord - 0.5);

/* ---------------- 每帧更新：全部状态 = f(t) ---------------- */
function update(t) {
  let fl = 0;
  for (const e of FLASH_EVENTS) { const p = (t - e.t) / e.dur; if (p >= 0 && p < 1) fl += e.amp * (1 - p) * (1 - p); }
  S.fx.flash = fl;
  const ms = CONFIG.acts[2].start;
  S.mother.thrust = t < ms ? 1 : 1 + 0.6 * (1 - Math.sin(clamp((t - ms) / 6, 0, 1) * Math.PI / 2));
  skyMat.uniforms.uTime.value = t;
  starMat.uniforms.uTime.value = t;
  dustMat.uniforms.uTime.value = t;
  earthUniforms.uTime.value = t;
  cloudMat.uniforms.uTime.value = t;
  earthMesh.rotation.y = 0.4 + t * 0.004;
  cloudMesh.rotation.y = 0.4 + t * 0.0052;
  updateRocks(t);

  /* 曙光号：幕一~幕二沿关键帧飞行，其余时间待机 */
  const h = hero;
  const cw = t < 54 ? 1 - smooth(clamp((t - 52) / 2, 0, 1)) : 0;
  if (t < 54) {
    const keys = t < 26 ? CH.hero : CH.hero2;
    keyPos(keys, t, _v1); heroRotAt(keys, t, _v2);
    h.root.position.set(_v1.x, _v1.y + Math.sin(t * 0.85) * 0.3, _v1.z);
    h.root.rotation.set(_v2.x, _v2.y + Math.sin(t * 0.23) * 0.04, _v2.z);
  } else {
    h.root.position.set(CONFIG.world.heroPos[0], CONFIG.world.heroPos[1] + Math.sin(t * 0.85) * 0.55, CONFIG.world.heroPos[2]);
    h.root.rotation.set(0, S.hero.face + Math.sin(t * 0.23) * 0.06, Math.sin(t * 0.5) * 0.02);
  }
  h.hips.rotation.x = Math.sin(t * 0.7) * 0.02;
  h.torso.rotation.y = Math.sin(t * 0.4) * 0.045;
  h.head.rotation.y = Math.sin(t * 0.6) * 0.12;
  h.head.rotation.x = Math.sin(t * 0.83) * 0.04;
  h.armL.sh.rotation.set(0.1 + Math.sin(t * 0.72) * 0.03, 0, 0.16 + Math.sin(t * 0.75) * 0.04);
  h.armR.sh.rotation.set(-0.42 + Math.sin(t * 0.6) * 0.03, 0, -0.18 - Math.sin(t * 0.7 + 1) * 0.04);
  h.armL.el.rotation.x = -0.32 + Math.sin(t * 0.8) * 0.03;
  h.armR.el.rotation.x = -0.55;
  h.legL.th.rotation.x = 0.1 + Math.sin(t * 0.8) * 0.03;
  h.legR.th.rotation.x = -0.06 + Math.sin(t * 0.8 + 2) * 0.03;
  h.legL.kn.rotation.x = -0.16; h.legR.kn.rotation.x = -0.1;
  if (cw > 0) {
    h.legL.th.rotation.x += -0.55 * cw; h.legR.th.rotation.x += -0.45 * cw;
    h.legL.kn.rotation.x += 0.7 * cw; h.legR.kn.rotation.x += 0.6 * cw;
    h.armL.sh.rotation.x += -0.5 * cw; h.armL.el.rotation.x += -0.4 * cw;
    h.armR.sh.rotation.x += -0.3 * cw;
    h.torso.rotation.x = 0.12 * cw;
  }
  h.bladeGroup.rotation.set(-0.45, 0, -0.55);
  const sw = t - CH.slash;
  if (sw > -0.3 && sw < 0.5) {
    const k = smooth(clamp((sw + 0.3) / 0.8, 0, 1));
    h.armR.sh.rotation.z = -0.18 - 1.6 * k;
    h.armR.sh.rotation.x = -0.42 - 0.8 * Math.sin(k * Math.PI);
    h.bladeGroup.rotation.z = -0.55 + 1.4 * k;
  }
  const sw2 = t - CH.finisher.dash;
  if (sw2 > -0.4 && sw2 < 0.8) {
    const k = smooth(clamp((sw2 + 0.4) / 1.2, 0, 1));
    h.armR.sh.rotation.z = -0.18 - 2.0 * k;
    h.armR.sh.rotation.x = -0.42 - 1.2 * Math.sin(k * Math.PI);
    h.bladeGroup.rotation.z = -0.55 + 1.8 * k;
    h.bladeGroup.rotation.x = -0.45 - 0.6 * Math.sin(k * Math.PI);
  }
  h.bladeGroup.scale.y = Math.max(S.hero.blade, 0.001) * (0.97 + 0.03 * Math.sin(t * 8.5));
  h.bladeMat.uniforms.uTime.value = t;

  M.glowCyan.color.setHex(C.heroGlow).convertSRGBToLinear().multiplyScalar(1.5 + 0.3 * Math.sin(t * 3.1));
  h.trailMats.forEach(m => { m.uniforms.uIntensity.value = S.hero.thrust * (0.85 + 0.15 * Math.sin(t * 21)); });

  /* 黑潮编队：幕一收拢包围，被击坠后隐藏（纯 f(t)） */
  enemies.forEach((e, i) => {
    if (t >= CH.deaths[i]) { e.root.visible = false; return; }

    foePosAt(i, t, _v1);
    e.root.position.copy(_v1);
    heroPosAt(t, _v2);
    _v3.subVectors(_v2, _v1);
    const yaw = Math.atan2(-_v3.x, -_v3.z);
    const pitch = Math.atan2(_v3.y, Math.hypot(_v3.x, _v3.z)) * 0.4;
    e.root.rotation.set(pitch, yaw, 0.15 * Math.sin(t * 0.7 + e.phase));

  }
  const dmg = Math.max(0, t - CH.finisher.hit);
  mother.root.rotation.z = Math.sin(t * 0.11) * 0.008 + dmg * 0.02;
  mother.root.rotation.x = dmg * 0.008;
  const pulse = 1 + 0.1 * Math.sin(t * 2.2);
  mother.core.scale.setScalar(pulse);
  mother.core.material.color.setHex(C.motherCore).convertSRGBToLinear().multiplyScalar((1.25 + 0.4 * Math.sin(t * 2.2)) * S.mother.core);
  mother.ring1.rotation.z = Math.min(t, CH.finisher.hit) * 0.55;
  mother.ring2.rotation.z = -Math.min(t, CH.finisher.hit) * 0.38;
  mother.ring2.rotation.y = 0.4;
  mother.trails.forEach(m => { m.uniforms.uIntensity.value = S.mother.thrust * (0.9 + 0.1 * Math.sin(t * 13)); });

  trailMats.forEach(m => { m.uniforms.uTime.value = t; });

  updateCamera(t);
  updateCombat(t);
  updateCombat2(t);
  sunGroup.quaternion.copy(camera.quaternion);
  renderFrame(t, S.fx);
}

/* ---------------- HUD / 控制条 / 主循环 ---------------- */

function syncPlayUI() {
  const playing = !tl.paused();
  icPlay.style.display = playing ? 'none' : 'block';
  icPause.style.display = playing ? 'block' : 'none';
  btnRev.classList.toggle('on', tl.reversed());
}
function togglePlay() {
  if (tl.paused()) {
    if (!tl.reversed() && tl.time() >= CONFIG.duration - 0.01) tl.time(0);
    if (tl.reversed()) tl.reverse(); else tl.play();
  } else tl.pause();
  syncPlayUI();
}
function replay() { tl.reversed(false).timeScale(1).time(0).play(); syncPlayUI(); }
function toggleReverse() {
  if (!tl.reversed()) {
    if (tl.time() < 0.05) tl.time(CONFIG.duration);
    tl.reverse();
  } else {
    tl.play();
  }
  syncPlayUI();
}
btnPlay.addEventListener('click', () => { togglePlay(); btnPlay.blur(); });
btnReplay.addEventListener('click', () => { replay(); btnReplay.blur(); });
btnRev.addEventListener('click', () => { toggleReverse(); btnRev.blur(); });

/* 进度条拖动（拖动期间暂停，松手恢复原播放态） */
let dragging = false, wasPlaying = false, wasReversed = false;
function seekFromEvent(e) {
  const r = elTrack.getBoundingClientRect();
  const frac = clamp((e.clientX - r.left) / r.width, 0, 1);
  tl.time(frac * CONFIG.duration);
}
elTrack.addEventListener('pointerdown', e => {
  dragging = true; wasPlaying = !tl.paused(); wasReversed = tl.reversed();
  tl.pause();
  elTrack.setPointerCapture(e.pointerId);
  seekFromEvent(e); syncPlayUI();
});
elTrack.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
elTrack.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  if (wasPlaying) { if (wasReversed) tl.reverse(); else tl.play(); }
  syncPlayUI();
});
elTrack.addEventListener('pointercancel', () => {
  if (!dragging) return;
  dragging = false;
  if (wasPlaying) { if (wasReversed) tl.reverse(); else tl.play(); }
  syncPlayUI();
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'KeyR') replay();
  else if (e.code === 'KeyV') toggleReverse();
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'ArrowLeft') { tl.time(clamp(tl.time() - 2, 0, CONFIG.duration)); }
  else if (e.code === 'ArrowRight') { tl.time(clamp(tl.time() + 2, 0, CONFIG.duration)); }
  else if (e.code === 'Home') tl.time(0);
  else if (e.code === 'End') tl.time(CONFIG.duration);
});

/* ---------------- WebAudio：程序化 BGM+SFX 离线烘焙整轨 ----------------
   音频与画面同源：整轨是 t 的函数，播放=从 tl.time() 起播缓冲，
   倒放=反相缓冲，暂停/拖动=停源（自然静音），seek=重新对齐。 */
const AU = { ctx: null, master: null, buf: null, rbuf: null, src: null, ready: false, muted: false, anchorCtx: 0, anchorT: 0, dir: 1 };
function audioInit() {
  if (AU.ctx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AU.ctx = new Ctx();
  AU.master = AU.ctx.createGain();
  AU.master.gain.value = AU.muted ? 0 : CONFIG.audio.master;
  AU.master.connect(AU.ctx.destination);
  ensureBake();
}
let bakeP = null;
function ensureBake() {
  if (!bakeP) bakeP = bakeSoundtrack().then(buf => { AU.buf = buf; AU.ready = true; });
  return bakeP;
}
ensureBake();
function unlockAudio() { audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); }
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', unlockAudio);
function toggleMute() {
  AU.muted = !AU.muted;
  if (AU.master) AU.master.gain.value = AU.muted ? 0 : CONFIG.audio.master;
  $('ic-snd').style.display = AU.muted ? 'none' : 'block';
  $('ic-mut').style.display = AU.muted ? 'block' : 'none';
  $('btn-mute').classList.toggle('on', AU.muted);
  $('ic-snd2').style.display = AU.muted ? 'none' : 'block';
  $('ic-mut2').style.display = AU.muted ? 'block' : 'none';
  $('hud-snd').classList.toggle('on', AU.muted);
}
$('btn-mute').addEventListener('click', () => { toggleMute(); $('btn-mute').blur(); });
$('hud-snd').addEventListener('click', () => { unlockAudio(); toggleMute(); });

function bakeSoundtrack() {
  const sr = 44100, dur = CONFIG.duration, A = CONFIG.audio, CH = CONFIG.choreo;
  const oc = new OfflineAudioContext(1, Math.ceil(dur * sr), sr);
  const music = oc.createGain(); music.gain.value = A.music; music.connect(oc.destination);
  const sfx = oc.createGain(); sfx.gain.value = A.sfx; sfx.connect(oc.destination);
  music.gain.setValueAtTime(A.music, 57.5);
  music.gain.linearRampToValueAtTime(0.0001, 59.9);
  const nb = oc.createBuffer(1, sr * 2, sr);
  const nd = nb.getChannelData(0); let ns = 987654321;
  for (let i = 0; i < nd.length; i++) { ns = (ns * 16807) % 2147483647; nd[i] = (ns / 2147483647) * 2 - 1; }
  function tone(dest, type, f0, f1, t0, t1, vol, atk) {
    const o = oc.createOscillator(), g = oc.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t1);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (atk || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t1);
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t1 + 0.05);
  }
  function noise(dest, t0, t1, vol, fType, f0, f1, q) {
    const s = oc.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = oc.createBiquadFilter(); f.type = fType; f.Q.value = q || 0.8;
    f.frequency.setValueAtTime(f0, t0);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, t1);
    const g = oc.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t1);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t0); s.stop(t1 + 0.05);
  }
  function padTone(f, t0, t1, vol, cut) {
    const o = oc.createOscillator(), g = oc.createGain(), fl = oc.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f;
    fl.type = 'lowpass'; fl.frequency.value = cut;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.5);
    g.gain.setValueAtTime(vol, t1 - 0.4);
    g.gain.linearRampToValueAtTime(0, t1);
    o.connect(fl); fl.connect(g); g.connect(music); o.start(t0); o.stop(t1 + 0.05);
  }
  const kick = (t, v) => { tone(music, 'sine', 150, 40, t, t + 0.22, v, 0.004); noise(music, t, t + 0.03, v * 0.18, 'highpass', 2000); };
  const hat = (t, v) => noise(music, t, t + 0.05, v, 'highpass', 6500);
  const snare = (t, v) => { noise(music, t, t + 0.18, v, 'bandpass', 1800, 0, 1.2); tone(music, 'triangle', 220, 160, t, t + 0.1, v * 0.5); };
  const bass = (t, f, v) => tone(music, 'square', f, f, t, t + 0.2, v, 0.008);
  const laser = (t, f0, f1, v) => tone(sfx, 'square', f0, f1, t, t + 0.14, v, 0.005);
  const whoosh = (t, d, f0, f1, v) => noise(sfx, t, t + d, v, 'bandpass', f0, f1, 1.2);
  const boom = (t, v) => { noise(sfx, t, t + 0.9, v, 'lowpass', 5000, 120); tone(sfx, 'sine', 90, 35, t, t + 0.6, v * 0.9, 0.005); };
  const CHORDS = [
    [146.83, 174.61, 220.00],
    [116.54, 146.83, 174.61],
    [98.00, 116.54, 146.83],
    [110.00, 138.59, 164.81]
  ];
  const beat = 60 / A.bpm;
  for (let bar = 0; bar * 4 * beat < 54; bar++) {
    const t0 = bar * 4 * beat, ch = CHORDS[bar % 4];
    const sec = t0 < 12 ? 1 : t0 < 26 ? 2 : t0 < 42 ? 3 : t0 < 48.5 ? 4 : 5;
    ch.forEach(f => padTone(f, t0, t0 + 4 * beat, sec === 1 ? 0.05 : 0.04, 500 + sec * 130));
    if (sec >= 2) for (let b = 0; b < 4; b++) {
      const kt = t0 + b * beat;
      if (sec === 4 && kt >= 47.2) continue;
      if (sec === 5 && b % 2 === 1) continue;
      kick(kt, sec >= 3 ? 0.85 : 0.7);
    }
    if (sec >= 2) for (let e = 0; e < 8; e++) hat(t0 + e * beat / 2, sec >= 3 ? 0.14 : 0.1);
    if (sec >= 3 && sec <= 5) { snare(t0 + beat, 0.26); snare(t0 + 3 * beat, 0.26); }
    if (sec >= 2) for (let e = 0; e < 8; e++) bass(t0 + e * beat / 2, ch[e % 3] / 2, 0.16);
    if (sec === 3) ch.forEach(f => tone(music, 'triangle', f * 2, f * 2, t0, t0 + 0.4, 0.09, 0.01));
  }
  /* 主音动机：斩击 / 必杀命中 */
  [440, 587.33, 523.25, 440].forEach((f, i) => tone(music, 'triangle', f, f, 20.2 + i * 0.3, 20.5 + i * 0.3, 0.26, 0.01));
  [587.33, 698.46, 880, 1174.66].forEach((f, i) => {
    tone(music, 'sawtooth', f, f, 48.7 + i * 0.3, 49.4 + i * 0.3, 0.14, 0.01);
    tone(music, 'triangle', f, f, 48.7 + i * 0.3, 49.6 + i * 0.3, 0.24, 0.01);
  });
  /* 蓄力上升 42→48.5 */
  (function () {
    const t0 = CH.finisher.charge, t1 = CH.finisher.hit;
    const s = oc.createBufferSource(); s.buffer = nb; s.loop = true;
    const f = oc.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(300, t0); f.frequency.exponentialRampToValueAtTime(6000, t1);
    const g = oc.createGain();
    g.gain.setValueAtTime(0.02, t0); g.gain.exponentialRampToValueAtTime(0.35, t1);
    g.gain.linearRampToValueAtTime(0, t1 + 0.05);
    s.connect(f); f.connect(g); g.connect(sfx); s.start(t0); s.stop(t1 + 0.1);
    const o = oc.createOscillator(), og = oc.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(880, t1);
    og.gain.setValueAtTime(0.001, t0); og.gain.exponentialRampToValueAtTime(0.12, t1);
    og.gain.linearRampToValueAtTime(0, t1 + 0.05);
    o.connect(og); og.connect(sfx); o.start(t0); o.stop(t1 + 0.1);
  })();
  /* 定格：钟 + 解决垫 */
  tone(music, 'sine', 1174.66, 1174.66, 54, 56.5, 0.2, 0.005);
  tone(music, 'sine', 1760, 1760, 54, 55.6, 0.08, 0.005);
  [293.66, 349.23, 440, 659.25].forEach(f => padTone(f, 54, 59.8, 0.06, 1200));
  /* SFX 事件（与画面编排同源 CONFIG.choreo） */
  CH.bolts.forEach(b => laser(b[0], 500, 160, 0.18));
  CH.mBolts.forEach(b => laser(b[0], 420, 130, 0.2));
  CH.hBolts.forEach(b => laser(b[0], 900, 240, 0.2));
  CH.missiles.forEach(m => whoosh(m[0], 0.5, 400, 2500, 0.32));
  CH.deaths.forEach(d => boom(d, 0.65));
  whoosh(CH.slash, 0.35, 800, 7000, 0.45);
  tone(sfx, 'triangle', 1200, 2600, CH.slash, CH.slash + 0.18, 0.16, 0.005);
  whoosh(CH.finisher.dash, 0.6, 600, 4000, 0.45);
  boom(CH.finisher.hit, 0.95);
  noise(sfx, CH.finisher.hit, CH.finisher.hit + 1.4, 0.28, 'highpass', 3000);
  return oc.startRendering();
}
function reverseBuffer(buf) {
  const r = AU.ctx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const a = buf.getChannelData(c), b = r.getChannelData(c);
    for (let i = 0, n = a.length; i < n; i++) b[i] = a[n - 1 - i];
  }
  return r;
}
function audioStop() { if (AU.src) { try { AU.src.stop(); } catch (e) {} AU.src = null; } }
function audioSync() {
  if (!AU.ready || !AU.ctx) return;
  if (tl.paused() || dragging) { audioStop(); return; }
  const t = tl.time(), rev = tl.reversed();
  const off = rev ? CONFIG.duration - t : t;
  if (off <= 0.02 || off >= CONFIG.duration - 0.02) { audioStop(); return; }
  if (AU.src && AU.dir === (rev ? -1 : 1)) {
    const elapsed = AU.ctx.currentTime - AU.anchorCtx;
    const expect = rev ? AU.anchorT - t : t - AU.anchorT;
    if (Math.abs(elapsed - expect) < 0.12) return;
  }
  audioStop();
  const buf = rev ? (AU.rbuf || (AU.rbuf = reverseBuffer(AU.buf))) : AU.buf;
  const s = AU.ctx.createBufferSource(); s.buffer = buf; s.connect(AU.master);
  s.start(0, off);
  AU.src = s; AU.dir = rev ? -1 : 1; AU.anchorCtx = AU.ctx.currentTime; AU.anchorT = t;
}

/* HUD 覆盖层随画幅等比缩放 */
const frame = $('frame'), wrap = $('stage-wrap');
const overlay = document.createElement('div');
overlay.style.cssText = 'position:absolute;top:0;left:0;width:' + W + 'px;height:' + H + 'px;transform-origin:0 0;pointer-events:none;';
frame.querySelectorAll('.hud, .corner, #veil').forEach(n => overlay.appendChild(n));
frame.appendChild(overlay);
function fit() {
  const pad = 18;
  const aw = wrap.clientWidth - pad, ah = wrap.clientHeight - pad;
  const s = Math.max(Math.min(aw / W, ah / H), 0.05);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
  frame.style.width = (W * s) + 'px';
  frame.style.height = (H * s) + 'px';
  overlay.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);
fit();

/* HUD 同步 */
let lastActId = -1, fpsEMA = 60, lastNow = performance.now(), frameCount = 0;
function syncHUD(t) {
  elFill.style.width = (t / CONFIG.duration * 100) + '%';
  elThumb.style.left = (t / CONFIG.duration * 100) + '%';
  elTC.textContent = fmtTC(t);
  elTCCur.textContent = fmtShort(t);
  let act = CONFIG.acts[CONFIG.acts.length - 1];
  for (let i = 0; i < CONFIG.acts.length; i++) {
    if (t >= CONFIG.acts[i].start && t < CONFIG.acts[i].end) { act = CONFIG.acts[i]; break; }
  }
  if (act.id !== lastActId) {
    lastActId = act.id;
    elChip.textContent = act.name;
    elActEn.textContent = act.en;
    actLabelEls.forEach((el, i) => el.classList.toggle('cur', CONFIG.acts[i].id === act.id));
  }
  /* 字幕 / 必杀卡 / 定格标题：纯 f(t) */
  const fade = 0.35;
  let sub = null;
  for (const s of CONFIG.subtitles) if (t >= s.t0 && t < s.t1) { sub = s; break; }
  if (sub) {
    if (sub.text !== lastSubText) { lastSubText = sub.text; elSub.textContent = sub.text; }
    elSub.style.opacity = clamp(Math.min((t - sub.t0) / fade, (sub.t1 - t) / fade), 0, 1).toFixed(3);
  } else elSub.style.opacity = 0;
  const fc = CONFIG.cards.finisher;
  if (t >= fc.t0 && t < fc.t1) {
    const p = t - fc.t0;
    elFin.style.opacity = (Math.min(p / 0.12, 1) * clamp((fc.t1 - t) / 0.4, 0, 1)).toFixed(3);
    elFin.style.transform = 'scale(' + (1.12 - 0.12 * Math.min(p / 0.22, 1)).toFixed(3) + ')';
  } else elFin.style.opacity = 0;
  const tcard = CONFIG.cards.title;
  if (t >= tcard.t0) {
    const p = clamp((t - tcard.t0) / 1.2, 0, 1);
    elTitle.style.opacity = (p * p * (3 - 2 * p)).toFixed(3);
    elTitle.style.transform = 'translateY(' + ((1 - p) * 24).toFixed(1) + 'px)';
  } else elTitle.style.opacity = 0;
  const now = performance.now();
  const dt = now - lastNow; lastNow = now;
  if (dt > 0 && dt < 500) fpsEMA += (1000 / dt - fpsEMA) * 0.06;
  if (++frameCount % 12 === 0) elFPS.textContent = Math.round(clamp(fpsEMA, 0, 240));
}

/* 主循环：唯一 rAF 驱动（gsap.ticker），读 tl.time() → 全量更新 */
let booted = false;
gsap.ticker.add(() => {
  const t = tl.time();
  update(t);
  syncHUD(t);
  audioSync();
  if (!booted) {
    booted = true;
    $('veil').classList.add('gone');
  }
});

/* 起飞（支持 #t=秒 深链定位到某一帧，便于分享与逐幕检查） */
tl.time(0);
syncPlayUI();
const _deep = location.hash.match(/t=([\d.]+)/);
if (_deep) { tl.time(clamp(parseFloat(_deep[1]), 0, CONFIG.duration)); tl.pause(); }
else tl.play();
syncPlayUI();
window.__film = { tl, S, CONFIG, seek: t => tl.time(clamp(t, 0, CONFIG.duration)),
  dbg: { scene, camera, renderer, compositeMat, skyMat, sunGroup, earthGroup, beltGroup, M, hero, mother, update } };
</script>
