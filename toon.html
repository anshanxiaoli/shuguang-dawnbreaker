<title>曙光号 宇宙空戦</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e9f0;--panel:#fff;--ink:#11151d;--dim:#5b6475;--line:#c9cfdb;--hot:#e0243a;--cool:#1f6bff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06080d;--panel:#10141d;--ink:#e8ecf5;--dim:#8a93a6;--line:#252c3a;--hot:#ff4257;--cool:#5b9bff}}
:root[data-theme="dark"]{--bg:#06080d;--panel:#10141d;--ink:#e8ecf5;--dim:#8a93a6;--line:#252c3a;--hot:#ff4257;--cool:#5b9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 14px/1.5 "Zen Kaku Gothic New","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#app{max-width:1280px;margin:0 auto;padding:16px;display:grid;gap:12px}
#stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
#cv{width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;top:10px;color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
#tag{position:absolute;right:12px;top:10px;color:#fff;opacity:.6;font-size:12px;pointer-events:none}
#chips{display:flex;gap:8px;overflow-x:auto}
button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button[aria-pressed=true],.chip.on{background:var(--hot);color:#fff;border-color:var(--hot)}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#track{position:relative;flex:1 1 280px;min-width:200px;height:28px}
#seek{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--hot)}
#ticks i{position:absolute;top:6px;bottom:6px;width:2px;background:var(--cool);opacity:.7;pointer-events:none}
#clock{font-variant-numeric:tabular-nums;color:var(--dim)}
</style>
</head>
<body>
<main id="app">
  <div id="stage"><canvas id="cv"></canvas><div id="hud"></div><div id="tag">空格 播放 · H 隐藏信息</div></div>
  <div id="chips"></div>
  <div id="bar">
    <button id="bPlay">播放</button>
    <button id="bRe">重播</button>
    <button id="bRev" aria-pressed="false">倒放</button>
    <div id="track"><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="进度"><div id="ticks"></div></div>
    <button id="bMute" aria-pressed="false">静音</button>
    <span id="clock"></span>
    <select id="qual" aria-label="画质"><option value="high">1080p</option><option value="mid">720p</option></select>
    <button id="bExp" hidden>导出 WebM</button>
  </div>
</main>

/* ============================ 工具 ============================ */
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const $=id=>document.getElementById(id);
const rng=s=>()=>(s=s*16807%2147483647)/2147483647;      // 固定种子，保证确定性
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0')};
const easeOut=u=>gsap.parseEase('power3.out')(clamp(u,0,1));

/* ============================ 渲染器与场景 ============================ */
const cv=$('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false});
renderer.setPixelRatio(1);
const scene=new THREE.Scene(); scene.background=new THREE.Color(CFG.color.bg);
const cam=new THREE.PerspectiveCamera(50,16/9,0.1,2000);
const mat=c=>new THREE.MeshBasicMaterial({color:c});

// 星空（固定种子）
{ const R=rng(7),n=1800,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const th=R()*6.2832,ph=Math.acos(2*R()-1),r=400+R()*600;
    p.set([r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th)],i*3);}
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:CFG.color.star,size:1.6,sizeAttenuation:false}))); }

/* ============================ 程序化机体：赛璐珞三段着色 + 反壳轮廓线（机头朝 -Z；母舰舰首朝 +Z） ============================ */
const easeIO=gsap.parseEase('power2.inOut');
function kf(a,T){if(T<=a[0][0])return a[0][1];for(let i=1;i<a.length;i++)if(T<a[i][0]){const p=a[i-1],q=a[i];return p[1]+(q[1]-p[1])*easeIO((T-p[0])/(q[0]-p[0]));}return a[a.length-1][1];}
const LIGHT=new THREE.Vector3(.5,.8,.6).normalize(),_tc={},_oc={};
function toon(c,rim){const k=c+'_'+rim;return _tc[k]||(_tc[k]=new THREE.ShaderMaterial({
  uniforms:{base:{value:new THREE.Color(c)},dark:{value:new THREE.Color(c).multiplyScalar(.42)},rim:{value:new THREE.Color(rim)},ld:{value:LIGHT}},
  vertexShader:'varying vec3 vN,vV;void main(){vec4 w=modelMatrix*vec4(position,1.);vN=mat3(modelMatrix)*normal;vV=cameraPosition-w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:'uniform vec3 base,dark,rim,ld;varying vec3 vN,vV;void main(){vec3 n=normalize(vN);float d=dot(n,ld);float s=d>.25?1.:d>-.2?.7:0.;vec3 c=mix(dark,base,s);float r=1.-max(dot(n,normalize(vV)),0.);c+=rim*step(.7,r)*step(-.3,d)*.6;gl_FragColor=vec4(c,1.);}'}));}
function oline(th){return _oc[th]||(_oc[th]=new THREE.ShaderMaterial({uniforms:{th:{value:th},col:{value:new THREE.Color(CFG.color.outline)}},
  vertexShader:'attribute vec3 sn;uniform float th;void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position+sn*th,1.);}',
  fragmentShader:'uniform vec3 col;void main(){gl_FragColor=vec4(col,1.);}',side:THREE.BackSide}));}
function smoothN(g){const p=g.attributes.position,n=g.attributes.normal,m={},a=new Float32Array(p.count*3);
  const key=i=>p.getX(i).toFixed(3)+','+p.getY(i).toFixed(3)+','+p.getZ(i).toFixed(3);
  for(let i=0;i<p.count;i++){const s=m[key(i)]||(m[key(i)]=[0,0,0]);s[0]+=n.getX(i);s[1]+=n.getY(i);s[2]+=n.getZ(i);}
  for(let i=0;i<p.count;i++){const s=m[key(i)],l=Math.hypot(s[0],s[1],s[2])||1;a.set([s[0]/l,s[1]/l,s[2]/l],i*3);}
  g.setAttribute('sn',new THREE.BufferAttribute(a,3));}
function part(g,c,th,par,x=0,y=0,z=0,rim=CFG.color.hero.glow){smoothN(g);const m=new THREE.Mesh(g,toon(c,rim));m.add(new THREE.Mesh(g,oline(th)));m.position.set(x,y,z);par.add(m);return m;}
function glow(g,c,k,par,x=0,y=0,z=0){const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(k)}));m.position.set(x,y,z);par.add(m);return m;}
const grp=(par,x=0,y=0,z=0)=>{const g=new THREE.Group();g.position.set(x,y,z);par.add(g);return g;};
const Bx=(w,h,d)=>new THREE.BoxGeometry(w,h,d);

// 曙光号：setForm(0~1) 战机↔人形；setBlade(长度) 右手光刃
function buildHero(){
  const P=CFG.color.hero,K=0x2b3553,th=.035,root=new THREE.Group(),body=grp(root);
  part(Bx(1.1,1.2,.65),P.main,th,body); part(Bx(.7,.5,.12),P.accent,th,body,0,.15,-.38);
  part(Bx(.8,.5,.6),K,th,body,0,-.85,0); part(Bx(.8,.9,.35),K,th,body,0,.2,.5);
  const head=grp(body,0,.95,0); part(Bx(.5,.45,.5),P.main,th,head,0,.1,0); part(Bx(.1,.4,.12),P.accent,th,head,0,.5,-.05);
  const eyes=glow(Bx(.4,.08,.05),P.glow,2,head,0,.12,-.27);

  const hand=arm[1]; part(new THREE.CylinderGeometry(.07,.07,.5,8).rotateX(Math.PI/2),K,th,hand,0,-1.4,-.25);
  const blade=glow(new THREE.CylinderGeometry(.09,.09,1,8).rotateX(Math.PI/2),P.glow,2,hand,0,-1.4,-.5);
  const wing=[-1,1].map(s=>{const w=grp(body,s*.35,.25,.45);part(Bx(1.8,.07,.9),P.main,th,w,s*.9,0,.1);part(Bx(.5,.09,.92),P.accent,th,w,s*1.45,0,.1);return w;});
  const U=root.userData;

  P(Bx(12,4,40),M.main,0,0,0); [-1,1].forEach(s=>P(Bx(3.7,2.2,34),M.main,s*2.65,3,-2)); P(Bx(5,2.5,8),M.accent,0,5.2,-14);

    P(new THREE.CylinderGeometry(.7,.9,.5,8),M.accent,0,.25,0,t);P(Bx(.22,.22,1.6),M.main,0,.6,-.9,t);}

  for(let i=0;i<p.count;i++){const k=p.getX(i).toFixed(3)+'|'+p.getY(i).toFixed(3)+'|'+p.getZ(i).toFixed(3);o[k]=o[k]||(.7+R()*.6);p.setXYZ(i,p.getX(i)*o[k],p.getY(i)*o[k]*.85,p.getZ(i)*o[k]);}

// 特效：确定性爆炸（火球 + 火花 + 冲击环）。FX.burst(槽位, 爆炸年龄秒, 位置, 尺寸)，年龄超出 0~1.2s 则不显示
const FX=(()=>{
  const mk=(n,fire)=>{const R=rng(fire?3:9),d=new Float32Array(n*3),r=new Float32Array(n);
    for(let i=0;i<n;i++){const th=R()*6.2832,ph=Math.acos(2*R()-1);d.set([Math.sin(ph)*Math.cos(th),Math.sin(ph)*Math.sin(th),Math.cos(ph)],i*3);r[i]=R();}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
    g.setAttribute('aDir',new THREE.BufferAttribute(d,3));g.setAttribute('aR',new THREE.BufferAttribute(r,1));
    const m=new THREE.ShaderMaterial({uniforms:{age:{value:0},sz:{value:1},fire:{value:fire},px:{value:1000}},
      vertexShader:`attribute vec3 aDir;attribute float aR;uniform float age,sz,fire,px;varying float vK;
void main(){float k=clamp(age/mix(1.1,.9,fire),0.,1.);vK=k;float e=1.-pow(1.-k,3.);
vec3 p=aDir*mix(14.,4.5,fire)*(.3+aR)*e*sz*.5+vec3(0.,-1.5*k*k*sz*(1.-fire),0.);
vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
float ws=fire>.5?sz*mix(1.2,3.2,aR)*(.5+.9*e):sz*.18*(1.-k);gl_PointSize=px*ws/max(-mv.z,.1);}`,
      fragmentShader:`varying float vK;uniform float fire;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;
float a=smoothstep(.5,fire>.5?.0:.3,d);
vec3 c=fire>.5?mix(mix(vec3(1.,.95,.7),vec3(1.,.45,.1),smoothstep(0.,.35,vK)),vec3(.25,.04,.02),smoothstep(.35,1.,vK)):vec3(1.,.85,.5);
float f=fire>.5?(1.-vK)*(1.-vK):(1.-vK);gl_FragColor=vec4(c*a*f*(fire>.5?1.4:2.2),1.);}`,
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
    const p=new THREE.Points(g,m);p.frustumCulled=false;return p;};
  const pool=Array.from({length:8},()=>{const g=new THREE.Group(),f=mk(26,1),s=mk(160,0),
    rg=new THREE.Mesh(new THREE.RingGeometry(.92,1,48),new THREE.MeshBasicMaterial({color:new THREE.Color(1.6,1.4,1.1),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));
    g.add(f,s,rg);g.visible=false;scene.add(g);return {g,f,s,rg};});
  return{
    reset(){pool.forEach(o=>o.g.visible=false);},
    burst(i,age,pos,sz){const o=pool[i%8];if(age<0||age>1.2)return;o.g.visible=true;o.g.position.copy(pos);
      [o.f,o.s].forEach(p=>{p.material.uniforms.age.value=age;p.material.uniforms.sz.value=sz;});
      const k=age/1.2;o.rg.scale.setScalar(sz*(.5+16*(1-Math.pow(1-k,3))));o.rg.material.opacity=Math.max(0,1-k*1.4);},
    sync(c,h){const px=h/(2*Math.tan(c.fov*Math.PI/360));pool.forEach(o=>{o.f.material.uniforms.px.value=px;o.s.material.uniforms.px.value=px;o.rg.quaternion.copy(c.quaternion);});}
  };
})();

const NW=240;

  CFG.slows.forEach(([a,b,r,cu])=>seg.push([a,b,r],[b,b+cu,1+(1-r)*(b-a)/cu]));
  seg.push([CFG.freeze[0],CFG.freeze[1],t=>1-easeIO((t-CFG.freeze[0])/(CFG.freeze[1]-CFG.freeze[0]))],[CFG.freeze[1],99,0]);const w=[0];

const warp=T=>{const x=clamp(T,0,CFG.DURATION)*NW,i=Math.min(Math.floor(x),WT.length-2);return WT[i]+(WT[i+1]-WT[i])*(x-i);};   // 主时间→世界时间

  return [p[1]+(q[1]-p[1])*k,p[2]+(q[2]-p[2])*k,p[3]+(q[3]-p[3])*k];};

/* ============================ 各幕函数（t=幕内秒, u=幕内进度0~1, c=场景对象, a=本幕配置） ============================
   规则：只根据 t 计算状态，不累积、不读上一帧。 */
const ACT={
  act1(t,u,c,a){                                   // 突围被围（分镜 A1）
    const h=c.hero,E=[[-9,2,-14],[0,8,-12],[9,1,-14]];
    h.position.set(Math.sin(t*.8)*3,Math.cos(t*.6)*1.5,-t*8);
    h.rotation.z=Math.sin(t*.8)*.4+(t>7.5?6.2832*easeIO(clamp((t-7.5)/1.5,0,1)):0);
    c.foes.forEach((f,i)=>{if(t<4.5+i*.375)return;f.visible=true;let p;
      if(t<6){const k=easeIO(clamp((t-4.5)/1.5,0,1));p=E[i].map(v=>v*(1.5-.5*k));}
      else{const r=22-5*(t-6)/6,k=t*.9+i*2.094;p=[Math.cos(k)*r,Math.sin(k)*r*.6,-5];}
      f.position.set(h.position.x+p[0],h.position.y+p[1],h.position.z+p[2]);face(f,h.position);});
    const mp=(i,tt)=>{const k=-tt*.7+i*.5236,r=24+(i%3)*4;return [Math.cos(k)*r,Math.sin(k*1.3)*8,-5+Math.sin(k)*r*.5];};
    c.mooks.forEach((m,i)=>{if(t<6||(i===0&&t>=8.2))return;m.visible=true;const p=mp(i,t);
      m.position.set(h.position.x+p[0],h.position.y+p[1],h.position.z+p[2]);face(m,h.position);});
    if(t>=6&&t<10.5)trc(c,t,h.position);
    if(t>=8.2){const p=mp(0,8.2);FX.burst(3,t-8.2,new THREE.Vector3(Math.sin(8.2*.8)*3+p[0],Math.cos(8.2*.6)*1.5+p[1],-65.6+p[2]),2.2);}   // 流弹引爆杂兵
  },
  act2(t,u,c,a){                                   // 反击破阵（分镜 A2）：光刃斩 A、导弹毁 B、岩石砸 C
    const h=c.hero,P=hp(a.path,t),K=a.kills;h.position.set(P[0],P[1],P[2]);
    h.userData.setBlade(clamp((t-.3)/.5,0,1)*2.4);
    h.rotation.x=-6.2832*easeIO(clamp((t-6.3)/1,0,1));
    const A=new THREE.Vector3(-6,1,-26),B=new THREE.Vector3(8,3+Math.sin(t)*.5,-46),kC=easeIO(clamp((t-10.5)/3,0,1)),
      C=new THREE.Vector3(16-12*kC,6-6.5*kC,-110+48*kC);
    c.rocks[0].position.set(4,-1.5,-66); c.rocks[0].scale.setScalar(2.2);
    if(t<K[0]){c.foes[0].visible=true;c.foes[0].position.copy(A);face(c.foes[0],h.position);}
    if(t>=4.5&&t<K[1]){c.foes[1].visible=true;c.foes[1].position.copy(B);face(c.foes[1],h.position);}
    if(t>=10.5&&t<K[2]){c.foes[2].visible=true;c.foes[2].position.copy(C);face(c.foes[2],h.position);}
    FX.burst(0,t-K[0],A,3.5); FX.burst(1,t-K[1],new THREE.Vector3(8,3+Math.sin(K[1])*.5,-46),3.5); FX.burst(2,t-K[2],new THREE.Vector3(4,-.5,-62),3.5);
    c.mooks.forEach((m,i)=>{if(i>5||t<5||t>9.2)return;m.visible=true;m.position.set(h.position.x+(i-2.5)*4,h.position.y+Math.sin(t*2+i)*3,h.position.z+12+i*2);face(m,h.position);});
    const p0=hp(a.path,7.5);
    for(let j=0;j<6;j++)for(let k=0;k<6;k++){const s=(t-7.5-j*.08)/(1.5-j*.08)-k*.03;if(s<0||s>1)continue;
      const o=(j%2?1:-1)*.8,x0=p0[0]+o,y0=p0[1]+.6,z0=p0[2]-.5,x1=(x0+8)/2+(j-2.5)*5,y1=(y0+3)/2+(j%3-1)*6,z1=(z0-46)/2,q=1-s,m=c.missiles[j*6+k];
      m.visible=true;m.scale.setScalar(1-k*.14);m.position.set(q*q*x0+2*q*s*x1+s*s*8,q*q*y0+2*q*s*y1+s*s*3,q*q*z0+2*q*s*z1+s*s*-46);}
  },
  act3(t,u,c,a){                                   // 母舰对决（分镜 A3）：沟槽追跑、翼尖光刃清炉塔、主炮险避、冲向核心
    const h=c.hero,P=hp(a.path,t),Q=hp(a.path,t+.05);h.position.set(P[0],P[1],P[2]);
    const v=new THREE.Vector3(Q[0]-P[0],Q[1]-P[1],Q[2]-P[2]); if(v.length()>1e-4)face(h,h.position.clone().add(v));
    if(t>=10.5&&t<12)h.rotateZ(12.566*easeIO((t-10.5)/1.5));
    c.mother.visible=true; c.mother.position.set(...a.mother.pos);
    c.mooks.forEach((m,i)=>{const s=t-1.5-i*.15;if(s<0)return;m.visible=true;const sd=i%2?1:-1,k=clamp(s,0,4);
      m.position.set(sd*(8+k*5)+Math.sin(t*.8+i)*3,2+(i%4)*2.5+Math.sin(t+i)*1.5,-100+(i-6)*3.5+k*3);face(m,h.position);});
    if(t>=3&&t<10)trc(c,t,h.position);
    for(let i=0;i<6;i++){const ti=6+i*.2;FX.burst(i,t-ti,new THREE.Vector3(i%2?2.8:-2.8,4.5,hp(a.path,ti)[2]),1.4);}   // 翼尖光刃连锁小爆炸
    if(t>=9&&t<10.5){const k=(t-9)/1.5,w=1+Math.sin(k*3.14)*.5;c.beam.visible=true;c.beam.position.set(0,-.3,-66.5);c.beam.rotation.y=.5-k;c.beam.scale.set(w,w,140);}
    FX.burst(6,t-10.5,h.position,1.6);
  },
  act4(t,u,c,a){                                   // 必杀一击（分镜 A4）：光刃蓄力伸长、贯穿核心、连锁爆炸
    const h=c.hero,P=hp(a.path,t),b=a.blade;h.position.set(P[0],P[1],P[2]);
    h.userData.setBlade(t<1.5?b.len0:t<4.5?b.len0+(9-b.len0)*easeIO((t-1.5)/3):9+(b.len1-9)*easeIO(clamp((t-4.5)/1.5,0,1)));
    if(t<10.6){c.mother.visible=true;c.mother.position.set(...a.mother.pos);}
    FX.burst(0,t-6,new THREE.Vector3(0,3.3,-94),6);
    for(let i=0;i<8;i++)FX.burst(i+1,t-(7+i*.45),new THREE.Vector3(i%2?4:-4,3,-94-i*3.2),3.5);
    FX.burst(5,t-10.2,new THREE.Vector3(0,3,-100),14);
  },
  act5(t,u,c,a){                                   // 定格（分镜 A5）：世界时间减速到 0，火球用慢速年龄保持可见
    const P=hp(a.path,t);c.hero.position.set(P[0],P[1],P[2]);
    FX.burst(0,(t+.5)*.3,new THREE.Vector3(0,3,-100),16);
  },
};

/* ============================ 后处理链（核心 API 手写：泛光 + 径向模糊 + 色差 + 暗角 + 冲击帧） ============================ */
const HT=renderer.capabilities.isWebGL2?THREE.HalfFloatType:THREE.UnsignedByteType;
const mkRT=()=>new THREE.WebGLRenderTarget(4,4,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:HT});
const rtS=mkRT(),rtA=mkRT(),rtB=mkRT();
const quad=new THREE.PlaneBufferGeometry(2,2),ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
function pass(fs,uniforms){const m=new THREE.ShaderMaterial({uniforms,vertexShader:VS,fragmentShader:fs,depthTest:false,depthWrite:false});
  const mesh=new THREE.Mesh(quad,m); mesh.frustumCulled=false; const sc=new THREE.Scene(); sc.add(mesh); return {m,sc};}
const run=(p,target)=>{renderer.setRenderTarget(target);renderer.render(p.sc,ortho);};

const pBright=pass('uniform sampler2D tex;uniform float th;varying vec2 vUv;void main(){vec3 c=texture2D(tex,vUv).rgb;float l=max(c.r,max(c.g,c.b));gl_FragColor=vec4(c*smoothstep(th,th+.25,l),1.);}',
  {tex:{value:null},th:{value:.55}});
const pBlur=pass('uniform sampler2D tex;uniform vec2 dir;varying vec2 vUv;void main(){vec3 s=texture2D(tex,vUv).rgb*.227027;vec2 o1=dir*1.3846,o2=dir*3.2308;s+=(texture2D(tex,vUv+o1).rgb+texture2D(tex,vUv-o1).rgb)*.316216;s+=(texture2D(tex,vUv+o2).rgb+texture2D(tex,vUv-o2).rgb)*.070270;gl_FragColor=vec4(s,1.);}',
  {tex:{value:null},dir:{value:new THREE.Vector2()}});
const pMix=pass(`uniform sampler2D tScene,tBloom;uniform float bloom,rblur,chroma,vig,flash,inv,speed,uT,fade;uniform sampler2D tText;float hs(float n){return fract(sin(n*91.3458)*47453.5453);}uniform vec3 flashCol;varying vec2 vUv;
vec3 samp(vec2 uv){vec2 d=uv-.5;float k=chroma*length(d)*8.;return vec3(texture2D(tScene,uv+d*k).r,texture2D(tScene,uv).g,texture2D(tScene,uv-d*k).b);}
void main(){vec2 d=vUv-.5;vec3 c=vec3(0.);
for(int i=0;i<10;i++){float s=1.-rblur*float(i)/9.;c+=samp(.5+d*s);}c/=10.;
c+=texture2D(tBloom,vUv).rgb*bloom;c=mix(c,1.-c,inv);float an=atan(d.y,d.x),ln=hs(floor(an*70.)+floor(uT*12.)*13.);c+=speed*step(.9,ln)*smoothstep(.3,.8,length(d)*1.6);
c*=1.-vig*smoothstep(.35,.95,length(d)*1.4);vec4 tt=texture2D(tText,vUv);c=mix(c,tt.rgb,tt.a);c=mix(c,flashCol,flash);c*=1.-fade;gl_FragColor=vec4(c,1.);}`,
  {tScene:{value:rtS.texture},tBloom:{value:rtA.texture},bloom:{value:0},rblur:{value:0},chroma:{value:0},vig:{value:0},flash:{value:0},inv:{value:0},speed:{value:0},fade:{value:0},uT:{value:0},tText:{value:null},flashCol:{value:new THREE.Color()}});

function setQ(q){
  CFG.quality=q; const s=CFG.QUALITY[q],w=Math.round(CFG.W*s),h=Math.round(CFG.H*s);
  renderer.setSize(w,h,false); rtS.setSize(w,h); rtA.setSize(w>>1,h>>1); rtB.setSize(w>>1,h>>1);
  $('qual').value=q; dirty=true;
}

/* ============================ 帧合成：render(T) 是 T 的纯函数 ============================ */
let dirty=true,last=-1;
const actAt=T=>{let a=CFG.acts[0];for(const x of CFG.acts)if(T>=x.start)a=x;return a;};

function fxAt(a,T){
  const f=Object.assign({},CFG.fx,a.fx); let flash=0;
  for(const e of CFG.events) if(e.type==='flash'&&T>=e.t&&T<e.t+e.dur) flash=Math.max(flash,e.str*Math.pow(1-(T-e.t)/e.dur,2));
  for(const e of CFG.events) if(e.type==='invert'&&T>=e.t&&T<e.t+e.dur) f.invert=1; else if(e.type==='alarm'&&T>=e.t&&T<e.t+e.dur){f.chroma=.006;f.vignette=.75;}
  f.flash=flash; f.fade=clamp((T-CFG.fadeOut[0])/(CFG.fadeOut[1]-CFG.fadeOut[0]),0,1); return f;
}
function applyCamera(a,lt){
  let sh=a.shots[0]; for(const s of a.shots) if(lt>=s.t) sh=s;
  const k=gsap.parseEase(sh.ease)(clamp((lt-sh.t)/sh.dur,0,1)), L=(x,y)=>x.map((v,i)=>v+(y[i]-v)*k);
  const p=L(sh.from.p,sh.to.p), g=L(sh.from.t,sh.to.t), h=ctx.hero.position;
  const n=(Math.sin(lt*37.1)+Math.sin(lt*53.7+1.3))*.5, m=(Math.sin(lt*41.3+2)+Math.sin(lt*61.9))*.5;  // 确定性抖动
  const o=sh.abs?[0,0,0]:[h.x,h.y,h.z]; cam.position.set(o[0]+p[0]+n*sh.shake,o[1]+p[1]+m*sh.shake,o[2]+p[2]);
  cam.fov=sh.from.fov+(sh.to.fov-sh.from.fov)*k; cam.updateProjectionMatrix();
  cam.lookAt(o[0]+g[0],o[1]+g[1],o[2]+g[2]);
  return CFG.acts.indexOf(a)>=0?a.shots.indexOf(sh)+1:0;
}
function render(T){
  const a=actAt(T), lt=T-a.start, u=clamp(lt/(a.end-a.start),0,1);
  ctx.foes.forEach(f=>f.visible=false); ctx.mooks.forEach(m=>m.visible=false); FX.reset(); ctx.tracers.concat(ctx.missiles,[ctx.beam]).forEach(m=>m.visible=false);
  ctx.rocks.forEach(r=>{r.position.copy(r.userData.h);r.scale.setScalar(1);}); ctx.hero.rotation.set(0,0,0); ctx.hero.userData.setBlade(0); ctx.mother.visible=false; ctx.hero.visible=true;   // 每帧重置
  ctx.hero.userData.setForm(kf(CFG.keys.form,T)); ctx.mother.userData.setOpen(kf(CFG.keys.open,T)); ctx.mother.userData.setCharge(kf(CFG.keys.charge,T));
  ACT[a.fn](warp(T)-a.start,u,ctx,a);
  const si=applyCamera(a,lt), fx=fxAt(a,T);
  sky.position.copy(cam.position); FX.sync(cam,rtS.height);

  renderer.setRenderTarget(rtS); renderer.render(scene,cam);
  const w2=rtA.width,h2=rtA.height,r=fx.bloom.radius;
  pBright.m.uniforms.tex.value=rtS.texture; pBright.m.uniforms.th.value=fx.bloom.threshold; run(pBright,rtA);
  pBlur.m.uniforms.tex.value=rtA.texture; pBlur.m.uniforms.dir.value.set(r/w2,0); run(pBlur,rtB);
  pBlur.m.uniforms.tex.value=rtB.texture; pBlur.m.uniforms.dir.value.set(0,r/h2); run(pBlur,rtA);
  const U=pMix.m.uniforms; drawText(T); U.tText.value=tTex; U.speed.value=fx.speed; U.fade.value=fx.fade; U.uT.value=Math.floor(T*12)/12;
  U.bloom.value=fx.bloom.strength; U.rblur.value=fx.radialBlur; U.chroma.value=fx.chroma; U.vig.value=fx.vignette;
  U.flash.value=fx.flash; U.inv.value=fx.invert; U.flashCol.value.set(fx.flashColor);
  run(pMix,null);
  $('hud').textContent=`${a.id} ${a.name} / ${a.en} · 镜头 ${si} · ${fmt(T)}`;
  chips.forEach((c,i)=>c.classList.toggle('on',CFG.acts[i]===a));
}

/* ============================ 主时间轴（唯一时钟）：GSAP 时间轴只驱动 S.t ============================ */
const S={t:0};
const master=gsap.timeline({paused:true});
master.to(S,{t:CFG.DURATION,duration:CFG.DURATION,ease:'none'});
CFG.acts.forEach(a=>master.addLabel(a.id,a.start));
gsap.ticker.lagSmoothing(0);

/* ============================ BGM（程序合成：离线渲染一次，再随主时间轴播放；160 BPM、D 小调） ============================ */
const BGM=(()=>{
  const SR=44100,B=60/CFG.audio.bpm,bar=B*4,mf=m=>440*2**((m-69)/12);
  const CH={Dm:[50,57,62,65],Bb:[46,53,58,62],C:[48,55,60,64],Gm:[43,50,55,58],A:[45,52,57,61]},RT={Dm:38,Bb:34,C:36,Gm:31,A:33};
  let buf=null,ac=null,spk=null,gain=null,dest=null,src=null,t0=0,off=0,muted=false;
  async function build(){
    const o=new OfflineAudioContext(2,SR*CFG.DURATION,SR),out=o.createGain(),comp=o.createDynamicsCompressor(),wet=o.createGain(),cvb=o.createConvolver();
    out.gain.setValueAtTime(.9,0);out.gain.setValueAtTime(.9,58.5);out.gain.linearRampToValueAtTime(0,60);
    comp.threshold.value=-14;comp.ratio.value=6;wet.gain.value=.22;
    const ir=o.createBuffer(2,SR*2,SR);for(let c=0;c<2;c++){const d=ir.getChannelData(c),Q=rng(5+c);for(let i=0;i<d.length;i++)d[i]=(Q()*2-1)*Math.pow(1-i/d.length,3);}
    cvb.buffer=ir;out.connect(comp);out.connect(cvb);cvb.connect(wet);wet.connect(comp);comp.connect(o.destination);
    const nb=o.createBuffer(1,SR*3,SR),nd=nb.getChannelData(0),R=rng(99);for(let i=0;i<nd.length;i++)nd[i]=R()*2-1;
    const env=(g,t,a,d,v,r)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+d);g.gain.linearRampToValueAtTime(0,t+d+r);};
    const tone=(ty,f,t,d,v,{lp=2000,a=.01,r=.08,det=0,to}={})=>{const os=o.createOscillator(),fl=o.createBiquadFilter(),g=o.createGain();os.type=ty;os.frequency.setValueAtTime(f,t);if(to)os.frequency.linearRampToValueAtTime(to,t+d);os.detune.value=det;fl.type='lowpass';fl.frequency.value=lp;env(g,t,a,d,v,r);os.connect(fl);fl.connect(g);g.connect(out);os.start(t);os.stop(t+d+r+.05);};
    const nz=(t,d,v,ty,f,{q=1,to,a=.002}={})=>{const s=o.createBufferSource(),fl=o.createBiquadFilter(),g=o.createGain();s.buffer=nb;fl.type=ty;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);fl.Q.value=q;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(out);s.start(t,R()*.3);s.stop(t+d+.05);};
    const kick=(t,v=.7)=>{const os=o.createOscillator(),g=o.createGain();os.frequency.setValueAtTime(160,t);os.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);os.connect(g);g.connect(out);os.start(t);os.stop(t+.4);};
    const snare=(t,v=.35)=>{nz(t,.18,v,'bandpass',1900,{q:.8});tone('triangle',190,t,.06,v*.6,{lp:1500,a:.001,r:.06});};
    const hat=(t,v=.08,op)=>nz(t,op?.16:.04,v,'highpass',7500);
    const boom=(t,v=.9)=>{tone('sine',70,t,.2,v,{a:.002,r:2.2,to:28});nz(t,2.2,v*.5,'lowpass',900,{to:60});};
    const crash=(t,v=.3)=>nz(t,2.6,v,'highpass',3500);
    const riser=(t1,t2,v=.25)=>nz(t1,t2-t1,v,'bandpass',300,{q:2,to:7000,a:t2-t1-.05});
    const pad=(ch,t,d,v=.05,lp=900)=>CH[ch].forEach(m=>{tone('sawtooth',mf(m),t,d,v,{lp,a:.5,r:.8,det:-7});tone('sawtooth',mf(m),t,d,v,{lp,a:.5,r:.8,det:7});});
    const bass=(ch,t,v=.22)=>[0,0,12,0,0,0,12,7].forEach((x,i)=>tone('sawtooth',mf(RT[ch]+x),t+i*B/2,B*.42,v,{lp:520,a:.004,r:.05}));
    const lead=(t,sh=0,v=.08)=>[0,3,7,5,3,0,2,-2,0,3,7,10,8,7,3,5].forEach((x,i)=>{const f=mf(74+x+sh),q=t+i*B/2;tone('sawtooth',f,q,B*.45,v,{lp:3200,r:.06});tone('square',f,q,B*.45,v*.5,{lp:2400,r:.06,det:5});});
    const groove=(t,bars)=>{for(let b=0;b<bars;b++)for(let i=0;i<4;i++){const q=t+(b*4+i)*B;kick(q);if(i%2)snare(q);hat(q,.07);hat(q+B/2,.09,i===3);}};
    const roll=(t1,t2,v=.3)=>{let t=t1,s=B/2;while(t<t2){snare(t,v*(.4+.6*(t-t1)/(t2-t1)));t+=s;s=Math.max(B/8,s*.88);}};
    // A1 突围 0–12：低频持续音 + 脉冲，6s 鼓点渐入，9–10.5s 收束，10.5s 起升调
    tone('sawtooth',mf(26),0,12,.12,{lp:300,a:3,r:.5});tone('sawtooth',mf(33),0,12,.06,{lp:260,a:4,r:.5});
    for(let t=0;t<6;t+=B/2)tone('square',mf(38),t,B*.3,.035+.03*(t/6),{lp:400+t*150,r:.04});
    pad('Dm',6,6,.04,800);groove(6,2);kick(9,.5);kick(9.2,.35);kick(9.75,.5);kick(9.95,.35);
    riser(10.5,12,.3);roll(10.5,12,.35);boom(12,.9);crash(12,.35);
    // A2 反击 12–27：全编制，击破前一拍过门、击破点重击
    for(let i=0;i<10;i++){const ch=['Dm','Dm','Bb','C'][i%4],t=12+i*bar;pad(ch,t,bar,.045,1200);bass(ch,t);}
    groove(12,10);[1,3,5,7].forEach(i=>lead(12+i*bar));
    [16.5,21,25.5].forEach(k=>{roll(k-B*1.5,k,.3);boom(k,.8);crash(k,.3);});
    // A3 母舰 27–42：低沉铜管感铺底，34.5–36s 蓄力，36s 重击，39.75–40.5s 静一拍
    ['Dm','Dm','Bb','Bb','Gm','Gm','A','A','Dm','Dm'].forEach((ch,i)=>{const t=27+i*bar,d=i===8?.75:bar;pad(ch,t,d,.06,700);tone('sawtooth',mf(RT[ch]),t,d-.05,.2,{lp:260,a:.4});if(i<7){kick(t,.55);kick(t+B*2,.45);}});
    for(let t=30;t<34.5;t+=B/2)hat(t,.04);
    riser(34.5,36,.3);boom(36,.9);crash(36,.35);kick(39,.5);kick(39.2,.35);
    pad('Dm',40.5,1.5,.08,2500);kick(40.5,.7);roll(40.5,42,.35);
    // A4 必杀 42–53：心跳→升调琤音→贯穿重拍（48s）→回落→半速→终爆
    for(let t=42;t<43.5;t+=.75){kick(t,.5);kick(t+.2,.35);}
    const SC=[0,3,5,7,10];let n=0;
    for(let t=43.5;t<46.5;t+=B/4,n++){const k=(t-43.5)/3;tone('sawtooth',mf(50+SC[n%5]+12*Math.floor(n/10)),t,B*.2,.03+.09*k,{lp:2500,r:.04});}
    for(let t=46.5;t<48;t+=B/8,n++)tone('sawtooth',mf(62+SC[n%5]+12*(Math.floor(n/5)%2)),t,B*.1,.12,{lp:3500,r:.03});
    riser(43.5,48,.25);pad('Dm',45,3,.07,1800);roll(46.5,48,.4);
    boom(48,1);crash(48,.45);kick(48,.9);pad('Dm',48,1.5,.09,3000);
    groove(49.5,1);bass('Dm',49.5,.25);lead(49.5,0,.1);
    pad('Dm',51,1.5,.08,2200);kick(51,.7);riser(52.2,53,.3);boom(53,.8);crash(53,.4);
    // A5 定格 53–60：铺底 + 57s 起单旋律，最后长音淡出
    pad('Dm',53,4,.06,1000);pad('Bb',57,3.5,.06,900);
    [[57,74],[57.75,77],[58.5,81],[59.25,86]].forEach(([t,m],i)=>tone('sawtooth',mf(m),t,i<3?.7:1.2,.07,{lp:2200,a:.02,r:.8}));
    buf=await o.startRendering();
  }
  const api={ready:false,build,
    ensure(){if(ac)return;ac=new (window.AudioContext||window.webkitAudioContext)();gain=ac.createGain();gain.gain.value=CFG.audio.volume;spk=ac.createGain();spk.gain.value=muted?0:1;
      dest=ac.createMediaStreamDestination();gain.connect(spk);spk.connect(ac.destination);gain.connect(dest);},
    play(at){if(!buf)return;api.ensure();ac.resume();api.stop();src=ac.createBufferSource();src.buffer=buf;src.connect(gain);t0=ac.currentTime;off=at;src.start(0,at);},
    stop(){if(src){try{src.stop();}catch(e){}src=null;}},
    pos(){return src?off+ac.currentTime-t0:-1;},
    get on(){return !!src;},
    mute(m){muted=m;if(spk)spk.gain.value=m?0:1;},
    stream(){api.ensure();return dest.stream;}};
  build().then(()=>{api.ready=true;}).catch(e=>console.error('BGM',e));
  return api;
})();

/* ============================ 播放器 UI ============================ */
const chips=CFG.acts.map(a=>{const b=document.createElement('button');b.className='chip';b.textContent=`${a.id} ${a.name} ${a.en}`;
  b.onclick=()=>{master.pause();master.time(a.start);dirty=true;};$('chips').appendChild(b);return b;});
CFG.acts.forEach(a=>{if(a.start>0){const i=document.createElement('i');i.style.left=(a.start/CFG.DURATION*100)+'%';$('ticks').appendChild(i);}});

let rev=false,dragging=false,exporting=false,dl=null;
const seek=$('seek');
const togglePlay=()=>{ if(exporting)return;
  if(master.isActive()){master.pause();return;}
  if(!rev){if(S.t>=CFG.DURATION-.01)master.time(0);master.play();}
  else{if(S.t<=.01)master.time(CFG.DURATION);master.reverse();}};
const replay=()=>{if(exporting)return;rev=false;$('bRev').setAttribute('aria-pressed','false');master.time(0);master.play();};
$('bPlay').onclick=togglePlay; $('bRe').onclick=replay;
$('bRev').onclick=e=>{if(exporting)return;rev=!rev;e.currentTarget.setAttribute('aria-pressed',String(rev));
  if(master.isActive()||!master.paused()&&S.t>0&&S.t<CFG.DURATION){rev?master.reverse():master.play();}};
seek.addEventListener('pointerdown',()=>dragging=true);
addEventListener('pointerup',()=>dragging=false);
seek.addEventListener('input',()=>{if(exporting)return;master.pause();master.time(seek.value/1000*CFG.DURATION);dirty=true;});
$('qual').onchange=e=>{autoQ=false;setQ(e.target.value);};
$('bMute').onclick=e=>{const m=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(m));BGM.mute(m);};
$('bar').addEventListener('click',e=>e.target.blur&&e.target.tagName!=='INPUT'&&e.target.blur());
addEventListener('keydown',e=>{
  if(['INPUT','SELECT','BUTTON'].includes(e.target.tagName))return;
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.code==='KeyR')replay();
  else if(e.code==='KeyH'){const hh=!$('hud').hidden;$('hud').hidden=hh;$('tag').hidden=hh;}
  else if(e.code==='ArrowRight'||e.code==='ArrowLeft'){master.pause();
    master.time(clamp(S.t+(e.code==='ArrowRight'?1:-1)*(e.shiftKey?5:1),0,CFG.DURATION));dirty=true;}
});

/* ============================ 导出 WebM（实时录制 canvas；发布页通过 downloads 能力保存） ============================ */
async function exportVideo(){
  if(!dl||exporting||typeof MediaRecorder==='undefined')return;
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const prevQ=CFG.quality; setQ('high'); rev=false; master.pause(); master.time(0); render(0);
  const rec=new MediaRecorder(new MediaStream([...cv.captureStream(CFG.FPS).getVideoTracks(),...(BGM.ready?BGM.stream().getAudioTracks():[])]),{mimeType:mime,videoBitsPerSecond:CFG.exportBitrate});
  const chunks=[]; rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const stopped=new Promise(r=>rec.onstop=r);
  exporting=true; $('bExp').disabled=true; rec.start(250); master.play();
  await new Promise(r=>{const f=()=>{if(S.t>=CFG.DURATION-.001){gsap.ticker.remove(f);r();}};gsap.ticker.add(f);});
  await new Promise(r=>setTimeout(r,300)); rec.stop(); await stopped;
  exporting=false; $('bExp').disabled=false; setQ(prevQ);
  try{await dl.save({filename:'shoko-space-battle.webm',data:new Blob(chunks,{type:'video/webm'})});}
  catch(e){if(e&&e.code!=='declined')console.error(e);}
}
$('bExp').onclick=exportVideo;
if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{dl=d;if(d)$('bExp').hidden=false;}).catch(()=>{});}

// 性能保护：连续两个 2 秒窗口平均帧率低于 40 时自动降到 720p（手动改画质后不再自动调整）
let autoQ=true,fN=0,fT=performance.now(),lowN=0,qNote='';
function perfTick(){fN++;const n=performance.now();if(n-fT<2000)return;const fps=fN*1000/(n-fT);fN=0;fT=n;
  if(!master.isActive()||document.visibilityState!=='visible'){lowN=0;return;}
  lowN=fps<40?lowN+1:0;
  if(autoQ&&!exporting&&lowN>=2&&CFG.quality==='high'){setQ('mid');autoQ=false;qNote=' · 帧率偏低，已自动切到 720p';}}

/* ============================ 主循环：状态只来自 S.t，重复渲染同一时刻结果一致 ============================ */
gsap.ticker.add(()=>{
  if(S.t!==last||dirty){render(S.t);last=S.t;dirty=false;}
  if(!dragging)seek.value=S.t/CFG.DURATION*1000;
  perfTick();
  const wantA=BGM.ready&&master.isActive()&&!rev&&!dragging;   // BGM 只在正向播放时发声；拖动、暂停、倒放静音，偶差超 0.2s 自动重对齐
  if(wantA&&(!BGM.on||Math.abs(BGM.pos()-S.t)>.2))BGM.play(S.t); else if(!wantA&&BGM.on)BGM.stop();
  $('clock').textContent=fmt(S.t)+' / '+fmt(CFG.DURATION)+(BGM.ready?'':' · BGM 合成中…')+qNote;
  $('bPlay').textContent=exporting?'录制中…':master.isActive()?'暂停':'播放';
});
setQ(CFG.quality);
</script>
